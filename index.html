<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png">
    <title>SecureCrack</title>
</head>
<body>
    <img src="logo.png" alt="logo" width="200">
    <h1>SecureCrack</h1>
    <p>Crack a secure password. Choose from 3 passwords.</p>
    <div class="btns">
        <button>1</button>
        <button>2</button>
        <button>3</button>
    </div>
    <br/>
    <button>Hint</button>
    <p id="hint"></p>
    <p>Enter Answer</p>
    <div class="answer">
        <input type="text" placeholder="Enter Password Here">
        <button>Guess</button>
    </div>
</body>
<script src="scripts.js"></script>
</html>
